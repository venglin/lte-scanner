[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ltescan"
version = "0.1.0"
description = "Skaner i analizator warstwy fizycznej LTE (PSS/SSS, MIB, PCFICH, PDCCH, SIB1) dla HackRF"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[project.scripts]
ltescan = "ltescan.cli:main"

[tool.setuptools]
packages = ["ltescan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
